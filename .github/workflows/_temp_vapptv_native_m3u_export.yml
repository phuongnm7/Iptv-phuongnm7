name: _TEMP_vAppTV_NATIVE_M3U_EXPORT

on:
  push:
    paths:
      - ".github/workflows/_temp_vapptv_native_m3u_export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve vAppTV and build NM7 M3U
        run: |
          curl -L --fail --retry 3             -H "User-Agent: okhttp/4.12.0"             "https://freem3u.xyz/api/channels/x_1.0.1/app.json"             -o app.json

          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          from pathlib import Path
          from html import escape
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          API = "https://freem3u.xyz/api/channels/x_1.0.1/app.json"
          TIMEOUT = 12
          UA = "okhttp/4.12.0"

          data = json.loads(Path("app.json").read_text(encoding="utf-8"))
          channels = list(data.get("channels") or [])
          main_groups = [str(x.get("title")) for x in (data.get("group") or []) if x.get("title")]

          def channel_index(c):
              try: return int(c.get("channelIndex"))
              except: return 10**9

          channels.sort(key=channel_index)

          session_headers = {
              "User-Agent": UA,
              "Accept": "*/*",
          }

          def fetch_text(url, headers=None, data_bytes=None, method=None):
              h = dict(session_headers)
              if headers:
                  for k,v in headers.items():
                      h[str(k)] = str(v)
              req = urllib.request.Request(url, headers=h, data=data_bytes, method=method)
              with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                  raw = r.read()
                  return raw.decode("utf-8", "replace")

          def is_http_url(s):
              return isinstance(s, str) and re.match(r"^https?://", s, re.I)

          def is_stream_url(s):
              if not is_http_url(s): return False
              return bool(re.search(r"(\.m3u8|\.mpd)(\?|$)", s, re.I) or "/api/live/play.m3u8" in s)

          def clean_url(s):
              if not isinstance(s, str): return None
              s = s.strip()
              return s if is_http_url(s) else None

          def extract_json_path(obj, path):
              if not path: return obj
              cur = obj
              parts = re.findall(r"[^.\[\]]+", str(path))
              for p in parts:
                  if isinstance(cur, dict) and p in cur:
                      cur = cur[p]
                  elif isinstance(cur, list):
                      try: cur = cur[int(p)]
                      except: return None
                  else:
                      return None
              return cur

          def recurse_urls(obj, out):
              if isinstance(obj, str):
                  if is_http_url(obj): out.append(obj)
              elif isinstance(obj, dict):
                  for v in obj.values(): recurse_urls(v, out)
              elif isinstance(obj, list):
                  for v in obj: recurse_urls(v, out)

          def make_native_from_shaka(url):
              try:
                  p = urllib.parse.urlparse(url)
                  q = urllib.parse.parse_qs(p.query)
                  video = q.get("videoUrl", [None])[0]
                  audio = q.get("audioUrl", [None])[0]
                  keys = q.get("keys", [None])[0]
                  if video and is_http_url(video):
                      return {
                          "url": video,
                          "clearkey": keys if keys else None,
                          "source": "shaka-native"
                      }
                  if audio and is_http_url(audio) and is_stream_url(audio):
                      return {"url": audio, "source":"shaka-audio"}
              except Exception:
                  pass
              return None

          def resolve_spec(spec):
              results = []
              if not isinstance(spec, dict) or not isinstance(spec.get("url"), str):
                  return results
              url = spec["url"].strip()
              provider = spec.get("provider")
              headers = spec.get("headers") if isinstance(spec.get("headers"), dict) else {}

              # Direct source.
              if not provider:
                  native = make_native_from_shaka(url)
                  if native:
                      results.append({**native, "headers":headers})
                  elif is_http_url(url):
                      results.append({"url":url, "headers":headers, "source":"direct"})
                  return results

              if provider == "webview":
                  native = make_native_from_shaka(url)
                  if native:
                      native["headers"] = headers
                      results.append(native)
                  elif is_http_url(url):
                      results.append({"url":url, "headers":headers, "source":"webview"})
                  return results

              try:
                  if provider == "flow":
                      txt = fetch_text(url, headers)
                      try:
                          obj = json.loads(txt)
                          found=[]; recurse_urls(obj, found)
                          for u in found:
                              if is_stream_url(u) or is_http_url(u):
                                  results.append({"url":u,"headers":headers,"source":"flow-resolved"})
                      except Exception:
                          if is_stream_url(txt.strip()):
                              results.append({"url":txt.strip(),"headers":headers,"source":"flow-text"})
                      return results

                  if provider == "json":
                      cfg = spec.get("httpConfig") if isinstance(spec.get("httpConfig"), dict) else {}
                      method = str(cfg.get("method") or "GET").upper()
                      h = dict(headers)
                      cfg_headers = cfg.get("headers") if isinstance(cfg.get("headers"), dict) else {}
                      h.update(cfg_headers)
                      body = cfg.get("body")
                      body_bytes = None
                      if method not in ("GET","HEAD") and body is not None:
                          body_bytes = str(body).encode("utf-8")
                      txt = fetch_text(url, h, body_bytes, method)
                      try:
                          obj = json.loads(txt)
                          val = extract_json_path(obj, spec.get("jsonPath"))
                          vals=[]
                          if isinstance(val, str): vals=[val]
                          elif isinstance(val, list): vals=val
                          else:
                              tmp=[]; recurse_urls(val,tmp); vals=tmp
                          for v in vals:
                              u=clean_url(v)
                              if u: results.append({"url":u,"headers":h,"source":"json-resolved"})
                      except Exception:
                          pass
                      return results

                  if provider == "parser":
                      txt = fetch_text(url, headers)
                      start = str(spec.get("startWith") or "")
                      end = str(spec.get("endWith") or "")
                      n = int(spec.get("startWithIndex") or 1)
                      pos = 0
                      for _ in range(max(1,n)):
                          pos = txt.find(start, pos)
                          if pos < 0: break
                          pos += len(start)
                      else:
                          if end:
                              j = txt.find(end, pos)
                              val = txt[pos:j if j >= 0 else None]
                          else:
                              val = txt[pos:]
                          u=clean_url(val)
                          if u: results.append({"url":u,"headers":headers,"source":"parser-resolved"})
                      return results

              except Exception:
                  return results
              return results

          resolved_map = {}
          jobs=[]
          for ci,c in enumerate(channels):
              for ui,spec in enumerate(c.get("urls") or []):
                  jobs.append((ci,ui,spec))

          with ThreadPoolExecutor(max_workers=20) as ex:
              futs={ex.submit(resolve_spec,spec):(ci,ui) for ci,ui,spec in jobs}
              for fut in as_completed(futs):
                  ci,ui=futs[fut]
                  try: resolved_map[(ci,ui)] = fut.result()
                  except: resolved_map[(ci,ui)] = []

          def rank_source(x):
              u=x.get("url","").lower()
              if x.get("clearkey") and u.endswith(".mpd"): return 0
              if re.search(r"\.m3u8(\?|$)",u): return 1
              if re.search(r"\.mpd(\?|$)",u): return 2
              if "/api/live/play.m3u8" in u: return 3
              if x.get("source") in ("flow-resolved","json-resolved","parser-resolved"): return 4
              return 9

          # Group order = exactly the app-configured groups, followed by secondary tags
          secondary_groups=[]
          seen=set(main_groups)
          for c in channels:
              for g in c.get("group") or []:
                  g=str(g)
                  if g and g not in seen:
                      seen.add(g); secondary_groups.append(g)
          group_order=main_groups+secondary_groups

          entries=[]
          total_sources=0
          resolved_dynamic=0
          drm_entries=0
          multi_group_channels=0

          for ci,c in enumerate(channels):
              title=str(c.get("title") or c.get("id") or "Unknown channel")
              tvgid=str(c.get("tvgId") or c.get("id") or "")
              logo=str(c.get("thumbnail") or c.get("logo") or "")
              groups=[str(g) for g in (c.get("group") or []) if g]
              if len(groups)>1: multi_group_channels += 1

              candidates=[]
              for ui,spec in enumerate(c.get("urls") or []):
                  for x in resolved_map.get((ci,ui),[]):
                      x=dict(x); x["origIndex"]=ui; candidates.append(x)
              # stable dedupe
              ded=[]; seen_urls=set()
              for x in sorted(candidates,key=rank_source):
                  u=x.get("url")
                  key=(u,x.get("clearkey") or "")
                  if u and key not in seen_urls:
                      seen_urls.add(key); ded.append(x)
              candidates=ded
              total_sources += len(candidates)
              for x in candidates:
                  if x.get("source") in ("flow-resolved","json-resolved","parser-resolved","shaka-native"):
                      resolved_dynamic += 1
                  if x.get("clearkey"): drm_entries += 1

              # Preserve every group membership. If a channel has no group, use App.
              if not groups: groups=["vAppTV"]

              for g in groups:
                  for n,x in enumerate(candidates):
                      entries.append((g,channel_index(c),title,tvgid,logo,x,n))

          out=["#EXTM3U"]
          entry_no=0
          for group in group_order + (["vAppTV"] if "vAppTV" not in group_order else []):
              ge=[e for e in entries if e[0]==group]
              ge.sort(key=lambda e:(e[1], e[2], e[6]))
              for g,idx,title,tvgid,logo,x,n in ge:
                  url=x["url"]
                  display=title if n==0 else f"{title} • Nguồn dự phòng {n+1}"
                  line="#EXTINF:-1"
                  if tvgid: line += ' tvg-id="'+escape(tvgid,quote=True)+'"'
                  line += ' tvg-name="'+escape(title,quote=True)+'"'
                  if logo: line += ' tvg-logo="'+escape(logo,quote=True)+'"'
                  line += ' group-title="'+escape(g,quote=True)+'",'+display
                  out.append(line)
                  out.append("#X-APP-CHANNEL-ID:"+str(next((c.get("id") for c in channels if c.get("title")==title),title)))
                  out.append("#X-APP-CHANNEL-INDEX:"+str(idx if idx<10**9 else ""))
                  if x.get("clearkey") and re.search(r"\.mpd(\?|$)",url,re.I):
                      out.append("#KODIPROP:inputstream=inputstream.adaptive")
                      out.append("#KODIPROP:inputstream.adaptive.manifest_type=mpd")
                      out.append("#KODIPROP:inputstream.adaptive.license_type=clearkey")
                      out.append("#KODIPROP:inputstream.adaptive.license_key="+str(x["clearkey"]))
                  hs=x.get("headers") if isinstance(x.get("headers"),dict) else {}
                  ref=hs.get("Referer") or hs.get("referer")
                  ua=hs.get("User-Agent") or hs.get("user-agent")
                  if ref: out.append("#EXTVLCOPT:http-referrer="+str(ref))
                  if ua: out.append("#EXTVLCOPT:http-user-agent="+str(ua))
                  out.append(url)
                  entry_no += 1

          m3u=Path("vAppTV_1.0.2_NM7_FULL.m3u")
          m3u.write_text("\n".join(out)+"\n",encoding="utf-8")

          summary={
            "source_endpoint":API,
            "api_index":data.get("index"),
            "configured_groups":main_groups,
            "secondary_groups":secondary_groups,
            "channel_objects":len(channels),
            "channels_with_multiple_groups":multi_group_channels,
            "resolved_playable_source_variants":total_sources,
            "dynamic_sources_resolved":resolved_dynamic,
            "clearkey_drm_variants":drm_entries,
            "m3u_entries":entry_no,
            "generated_utc":datetime.now(timezone.utc).isoformat()
          }
          Path("vAppTV_1.0.2_NM7_SUMMARY.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Upload full M3U
        uses: actions/upload-artifact@v4
        with:
          name: vAppTV-1.0.2-NM7-FULL
          path: |
            vAppTV_1.0.2_NM7_FULL.m3u
            vAppTV_1.0.2_NM7_SUMMARY.json
          if-no-files-found: error
