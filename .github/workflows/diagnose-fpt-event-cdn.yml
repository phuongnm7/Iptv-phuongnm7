name: Diagnose NM7 FPT Event CDN

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-fpt-event-cdn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load source and test exact event-07 with multiple request profiles
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://raw.githubusercontent.com/phuongnm7/Iptv-phuongnm7/main/sources/fpt-events-source.m3u"
          EVENT07="https://vips-livecdn.fptplay.net/live/media/event-07/hls_avc_v6/index.m3u8"

          echo "Checking that event-07 exists verbatim in the source..."
          curl -fsSL --retry 3 --max-time 30 "$SOURCE" | grep -Fqx "$EVENT07"
          echo "event-07 is present in source."

          profiles=(
            "browser-desktop|Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36|https://fptplay.vn/|https://fptplay.vn"
            "android|Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36|https://fptplay.vn/|https://fptplay.vn"
            "vlc|VLC/3.0.21 LibVLC/3.0.21|https://fptplay.vn/|https://fptplay.vn"
            "vthanh|VThanhTivi|https://fptplay.vn/|https://fptplay.vn"
            "none|curl/8|https://fptplay.vn/|"
          )

          for p in "${profiles[@]}"; do
            IFS='|' read -r name ua referer origin <<< "$p"
            echo "=== PROFILE $name ==="
            tmp="$(mktemp)"
            extra=()
            if [ -n "$origin" ]; then extra=(-H "Origin: $origin"); fi
            status="$(curl --http1.1 -sS --max-time 20 \
              -A "$ua" \
              -H "Accept: application/vnd.apple.mpegurl,application/x-mpegURL,text/plain,*/*" \
              -H "Cache-Control: no-cache, no-store" \
              -H "Pragma: no-cache" \
              -H "Referer: $referer" \
              "${extra[@]}" \
              -o "$tmp" -w "%{http_code} %{content_type} %{size_download}" \
              "$EVENT07" 2>"$tmp.err")" || true
            echo "status=$status"
            echo "body_prefix=$(head -c 500 "$tmp" | tr "\n" " " | sed "s/[[:cntrl:]]/ /g")"
            if [ -s "$tmp.err" ]; then cat "$tmp.err"; fi
            rm -f "$tmp" "$tmp.err"

            echo "--- ffprobe ---"
            ffprobe -v error -rw_timeout 15000000 -user_agent "$ua" -referer "$referer" \
              -show_entries format=format_name,duration,start_time \
              -of default=nw=1 "$EVENT07" 2>&1 || true
          done

      - name: Compare GET, HEAD and Range for exact event-07
        shell: bash
        run: |
          set +e
          for URL in \
            "https://vips-livecdn.fptplay.net/live/media/event-06/hls_avc_v6/index.m3u8" \
            "https://vips-livecdn.fptplay.net/live/media/event-07/hls_avc_v6/index.m3u8" \
            "https://vips-livecdn.fptplay.net/live/media/event-08/hls_avc_v6/index.m3u8"; do
            echo "=== HEAD $URL ==="
            curl -I -sS --max-time 20 -A "Mozilla/5.0" -H "Referer: https://fptplay.vn/" "$URL" 2>&1
          done
          URL="https://vips-livecdn.fptplay.net/live/media/event-07/hls_avc_v6/index.m3u8"
          echo "=== GET Range ==="
          curl -sS --max-time 20 -A "Mozilla/5.0" -H "Referer: https://fptplay.vn/" -H "Range: bytes=0-8191" \
          echo "=== GET Range ==="
          curl -sS --max-time 20 -A "Mozilla/5.0" -H "Referer: https://fptplay.vn/" -H "Range: bytes=0-8191" \
            -o /tmp/e07-range -w "%{http_code} %{content_type} %{size_download}\n" "$URL" 2>&1
          head -c 400 /tmp/e07-range 2>/dev/null | tr "\n" " " || true
          echo
          rm -f /tmp/e07-range

      - name: Inspect FPT Play session headers and client configuration
        shell: bash
        run: |
          set -euo pipefail
          HOME_URL="https://fptplay.vn/"
          EVENT07="https://vips-livecdn.fptplay.net/live/media/event-07/hls_avc_v6/index.m3u8"
          echo "=== FPT Play homepage headers/cookies ==="
          curl -fsSL -D /tmp/fpt.headers -c /tmp/fpt.cookies --max-time 30 "$HOME_URL" -o /tmp/fpt.html
          sed -n '1,120p' /tmp/fpt.headers
          echo "Cookies:"
          cat /tmp/fpt.cookies || true
          echo "Script URLs:"
          grep -oE '<script[^>]+src="[^"]+"' /tmp/fpt.html | head -80 || true
          echo "Searching homepage for FPL-Custom/X_ID/player configuration:"
          grep -oiE 'FPL-Custom|X_ID|FPLCustom|livecdn|api\.fptplay[^" ]*' /tmp/fpt.html | head -100 || true

          echo "=== event-07 with FPT homepage cookies ==="
          curl -sS --http1.1 --max-time 20             -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36"             -H "Referer: https://fptplay.vn/"             -H "Origin: https://fptplay.vn"             -H "Accept: application/vnd.apple.mpegurl,application/x-mpegURL,*/*"             -b /tmp/fpt.cookies             -o /tmp/e07-cookie             -D /tmp/e07-cookie.headers             -w "status=%{http_code} type=%{content_type} size=%{size_download}\n"             "$EVENT07" || true
          cat /tmp/e07-cookie.headers
          head -c 500 /tmp/e07-cookie | tr '\n' ' ' || true
          echo
          rm -f /tmp/fpt.headers /tmp/fpt.cookies /tmp/fpt.html /tmp/e07-cookie /tmp/e07-cookie.headers

          echo "=== Inspect FPT Play JavaScript bundles ==="
          mkdir -p /tmp/fptjs
          grep -oE '<script[^>]+src="[^"]+"' /tmp/fpt.html | sed -E 's/.*src="([^"]+)".*/\1/' | while read -r p; do
            case "$p" in
              http*) u="$p" ;;
              /*) u="https://fptplay.vn$p" ;;
              *) u="https://fptplay.vn/$p" ;;
            esac
            b="/tmp/fptjs/$(echo "$p" | tr '/:?=&' '_')"
            curl -fsSL --max-time 30 "$u" -o "$b" || true
          done
          echo "Bundle matches:"
          grep -RohE 'FPL-Custom|FPLCustom|X_ID|X-ID|x-channel|device_id|livecdn|vips-livecdn|FPT_CUSTOM|customHeader' /tmp/fptjs 2>/dev/null | sort | uniq -c | sort -nr | head -100 || true
          echo "Relevant snippets:"
          grep -RniE 'FPL-Custom|FPLCustom|X_ID|X-ID|vips-livecdn|livecdn' /tmp/fptjs 2>/dev/null | head -80 || true

      - name: Test FPT client identity headers and inspect bundles
        shell: bash
        run: |
          set -euo pipefail
          EVENT07="https://vips-livecdn.fptplay.net/live/media/event-07/hls_avc_v6/index.m3u8"
          curl -fsSL -D /tmp/fpt.headers -c /tmp/fpt.cookies --max-time 30 "https://fptplay.vn/" -o /tmp/fpt.html
          DEVICE_ID="$(awk '$6=="device_id"{print $7}' /tmp/fpt.cookies | tail -1)"
          echo "device_id=$DEVICE_ID"

          echo "=== event-07 with device identity headers ==="
          profiles=(
            "x_id|-H|X_ID: $DEVICE_ID"
            "x_dash_id|-H|X-ID: $DEVICE_ID"
            "fpl_custom|-H|FPL-Custom: $DEVICE_ID"
            "fpl_json|-H|FPL-Custom: {"device_id":"$DEVICE_ID"}"
            "fpl_json_camel|-H|FPL-Custom: {"deviceId":"$DEVICE_ID"}"
          )
          for p in "${profiles[@]}"; do
            IFS='|' read -r name kind header <<< "$p"
            echo "--- $name ---"
            curl -sS --http1.1 --max-time 20               -A "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36"               -H "Referer: https://fptplay.vn/"               -H "Origin: https://fptplay.vn"               -H "Accept: application/vnd.apple.mpegurl,application/x-mpegURL,*/*"               -H "Cache-Control: no-cache"               -H "$header"               -b "/tmp/fpt.cookies"               -o /tmp/e07-ident -D /tmp/e07-ident.headers               -w "status=%{http_code} type=%{content_type} size=%{size_download}\n"               "$EVENT07" || true
            grep -iE 'HTTP/|x-srv:|x-channel:|content-type:|x-|ftel|cdn53|_ver:' /tmp/e07-ident.headers || true
            rm -f /tmp/e07-ident /tmp/e07-ident.headers
          done

          echo "=== inspect FPT Play JS bundles for player header strings ==="
          mkdir -p /tmp/fptjs
          grep -oE '<script[^>]+src="[^"]+"' /tmp/fpt.html | sed -E 's/.*src="([^"]+)".*/\1/' | while read -r p; do
            case "$p" in
              http*) u="$p" ;;
              /*) u="https://fptplay.vn$p" ;;
              *) u="https://fptplay.vn/$p" ;;
            esac
            b="/tmp/fptjs/$(echo "$p" | tr '/:?=&' '_')"
            curl -fsSL --max-time 30 "$u" -o "$b" || true
          done
          grep -RniE 'FPL-Custom|FPLCustom|X_ID|X-ID|device_id|livecdn|vips-livecdn|x-channel' /tmp/fptjs 2>/dev/null | head -120 || true
          rm -rf /tmp/fptjs /tmp/fpt.headers /tmp/fpt.cookies /tmp/fpt.html

      - name: Check Worker status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev/status" | jq .
