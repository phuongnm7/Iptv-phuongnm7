              for vs in cand.values():
                  for x in vs:
                      if x['source']==label: known_urls.add(x['url'])
          if os.getenv('SOURCE_A')=='1': add('/tmp/A.m3u','A')
          if os.getenv('SOURCE_B')=='1': add('/tmp/B.m3u','B')
          add('sources/golden-tv-selected.m3u','C'); add('sources/sport-selected.m3u','D'); add('sports-auto.m3u','LAST_GOOD'); add('/tmp/E.m3u','E')
          def health(c):
              ref=next((l.split('=',1)[1].strip() for l in c['block'].splitlines() if l.lower().startswith('#extvlcopt:http-referrer=')),None)
              if urlparse(c['url']).scheme not in ('http','https'): return c,False,'scheme'
              cmd=['curl','-L','--globoff','--silent','--show-error','--connect-timeout','3','--max-time',str(TIMEOUT),'--retry','0','-r','0-4095','-A','Mozilla/5.0 NM7-IPTV-Sports/2.0','-o','/dev/null','-w','%{http_code}',c['url']]
              if ref: cmd=cmd[:-3]+['-e',ref]+cmd[-3:]
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=TIMEOUT+2); code=p.stdout.strip()[-3:] if p.stdout else '000'; return c,code.isdigit() and 200<=int(code)<400,code
              except Exception as e: return c,False,type(e).__name__
          allc=[x for vs in cand.values() for x in vs]; results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=WORKERS) as ex:
              for r in ex.map(health,allc): results.append(r)
          priority={'A':0,'B':1,'C':2,'D':3,'E':10,'LAST_GOOD':9}; selected=[]
          for key,xs_all in cand.items():
              best=min(priority.get(x['source'],8) for x in xs_all); selected.extend([x for x in xs_all if priority.get(x['source'],8)==best])
          selected.sort(key=lambda x:(x['when'] is None,x['when'] or '',x['group'],x['name'],x['url']))
          # Final safety pass: never publish an explicitly dated event older than MAX_AGE,
          # including entries inherited from LAST_GOOD or any fallback source.
          before_stale_filter=len(selected)
          selected=[x for x in selected if not x['when'] or (NOW-dt.datetime.fromisoformat(x['when'])).total_seconds()/60 <= MAX_AGE]
          removed_stale=before_stale_filter-len(selected)
