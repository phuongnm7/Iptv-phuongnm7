name: Deploy NM7 vAppTV Dynamic Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/vapptv-live/**"
      - ".github/workflows/deploy-vapptv-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nm7-vapptv-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate Worker JavaScript
        working-directory: cloudflare/vapptv-live
        run: node --check src/index.js

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/vapptv-live
          wranglerVersion: "4"
          command: deploy src/index.js --config wrangler.jsonc

      - name: Verify playlist endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-vapptv-live.phuongnm7-iptv.workers.dev"
          HEALTH="$(curl -fsSL --retry 3 --max-time 30 "$BASE/health")"
          echo "$HEALTH"
          echo "$HEALTH" | jq -e '.ok == true and .mode == "dynamic-per-channel"' >/dev/null

          PLAYLIST="$(curl -fsSL --retry 3 --max-time 45 "$BASE/playlist.m3u")"
          printf '%s\n' "$PLAYLIST" | head -n 12
          printf '%s\n' "$PLAYLIST" | grep -q '^#EXTM3U'
          printf '%s\n' "$PLAYLIST" | grep -q '/stream?id='
          echo "Verified dynamic vAppTV playlist"
