name: _TEMP_DELETE_NM7_VAPPTV_WORKER

on:
  push:
    paths:
      - ".github/workflows/_temp_delete_nm7_vapptv_worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: delete nm7-vapptv-live --force
