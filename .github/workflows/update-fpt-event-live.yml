name: Update FPT Event Live Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpt-event-live-manual
  cancel-in-progress: false

jobs:
  scan:
    name: Manual full FPT scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan all sources once and validate response
        env:
          WORKER_URL: https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent --retry 3 --retry-delay 2 --max-time 90 "${WORKER_URL}/scan")"
          printf '%s\n' "$response"
          printf '%s' "$response" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          assert data.get("ok") is True, f"Scan failed: {data}"
          assert isinstance(data.get("candidates"), int) and data["candidates"] > 0, "No candidates"
          assert data.get("liveEntries", 0) + data.get("inactiveEntries", 0) + data.get("probeErrors", 0) == data["candidates"], "Scan totals do not match"
          assert data.get("workerVersion") == "fpt-event-resilient-v3", "Unexpected Worker version"
          assert data.get("probeErrors") == 0, "Probe errors: " + str(data.get("probeErrors"))
          print("Validated", data["candidates"], "candidates;", data["liveEntries"], "live")
          '
