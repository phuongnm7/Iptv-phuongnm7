name: _TEMP_vAppTV_DIAG_VIEON

on:
  push:
    paths:
      - ".github/workflows/_temp_vapptv_diag_vieon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe VieON POST sources
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          url="https://api.vieon.vn/backend/cm/v5/slug/livetv/detail?platform=web&ui=012021"
          for title,slug in [
            ("TN HD","/truyen-hinh-truc-tuyen/long-an-1/"),
            ("LTV2","/truyen-hinh-truc-tuyen/binh-thuan-1/"),
            ("DNRTV3","/truyen-hinh-truc-tuyen/dong-nai-3/")
          ]:
            body=urllib.parse.urlencode({"livetv_slug":slug,"platform":"web","ui":"012021"}).encode()
            req=urllib.request.Request(
              url,
              data=body,
              headers={"content-type":"application/x-www-form-urlencoded","User-Agent":"Mozilla/5.0"}
            )
            print("\n=====",title,"=====")
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                t=r.read().decode("utf-8","replace")
                print(t[:30000])
            except Exception as e:
              print("ERROR",repr(e))
          PY
