name: Diagnose NM7 FPT Event CDN

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-fpt-event-cdn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact source and direct event-07 access
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://raw.githubusercontent.com/phuongnm7/Iptv-phuongnm7/main/sources/fpt-events-source.m3u"
          EVENT07="https://vips-livecdn.fptplay.net/live/media/event-07/hls_avc_v6/index.m3u8"
          curl -fsSL --retry 3 --max-time 30 "$SOURCE" | grep -Fqx "$EVENT07"
          echo "SOURCE_OK event-07 present verbatim"
          curl -sS --http1.1 --max-time 20 -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36" -H "Referer: https://fptplay.vn/" -H "Origin: https://fptplay.vn" -H "Accept: application/vnd.apple.mpegurl,application/x-mpegURL,*/*" -o /tmp/e07 -D /tmp/e07.h -w "DIRECT status=%{http_code} type=%{content_type} size=%{size_download}\n" "$EVENT07" || true
          grep -iE "^HTTP/|^content-type:|^x-srv:|^x-channel:|^ftel-server:|^cdn53:|^_ver:" /tmp/e07.h || true
          head -c 300 /tmp/e07 | tr "\n" " " || true
          echo

      - name: Test FPT homepage identity headers
        shell: bash
        run: |
          set -euo pipefail
          EVENT07="https://vips-livecdn.fptplay.net/live/media/event-07/hls_avc_v6/index.m3u8"
          curl -fsSL --max-time 30 -c /tmp/fpt.cookies "https://fptplay.vn/" -o /tmp/fpt.html
          DEVICE_ID="$(awk '$6=="device_id"{print $7}' /tmp/fpt.cookies | tail -1)"
          echo "DEVICE_ID_PRESENT=$([ -n "$DEVICE_ID" ] && echo yes || echo no)"
          for header in "X_ID: $DEVICE_ID" "X-ID: $DEVICE_ID" "FPL-Custom: $DEVICE_ID"; do
            echo "=== $header ==="
            curl -sS --http1.1 --max-time 20 -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36" -H "Referer: https://fptplay.vn/" -H "Origin: https://fptplay.vn" -H "$header" -H "Accept: application/vnd.apple.mpegurl,application/x-mpegURL,*/*" -b /tmp/fpt.cookies -o /tmp/e07-id -D /tmp/e07-id.h -w "status=%{http_code} type=%{content_type}\n" "$EVENT07" || true
            grep -iE "^HTTP/|^content-type:|^x-srv:|^x-channel:" /tmp/e07-id.h || true
          done

      - name: Test transport-only relays for exact event-07
        shell: bash
        run: |
          set -u
          EVENT07="https://vips-livecdn.fptplay.net/live/media/event-07/hls_avc_v6/index.m3u8"
          encoded="$(python3 -c "import urllib.parse; print(urllib.parse.quote(\"$EVENT07\", safe=\"\"))")"
          for name_url in \
            "allorigins|https://api.allorigins.win/raw?url=$encoded" \
            "corsproxy|https://corsproxy.io/?url=$encoded" \
            "corsdev|https://proxy.cors.dev/$EVENT07"; do
            name="${name_url%%|*}"
            url="${name_url#*|}"
            echo "=== RELAY $name ==="
            rm -f /tmp/relay.body /tmp/relay.h
            curl -sS --max-time 30 -A "Mozilla/5.0" -o /tmp/relay.body -D /tmp/relay.h -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" "$url" 2>&1 || true
            grep -iE "^HTTP/|^content-type:|^location:" /tmp/relay.h 2>/dev/null || true
            if grep -q "#EXTM3U" /tmp/relay.body 2>/dev/null; then echo "VALID_HLS_MANIFEST"; else echo "NOT_HLS_MANIFEST"; fi
            head -c 350 /tmp/relay.body 2>/dev/null | tr "\n" " " || true
            echo
          done

      - name: Test fresh Vietnam HTTP proxies against exact event-07
        shell: bash
        run: |
          set -u
          EVENT07="https://vips-livecdn.fptplay.net/live/media/event-07/hls_avc_v6/index.m3u8"
          curl -fsSL --max-time 30             "https://hproxy.com/api/proxy-list?format=json&country=VN&protocol=http&recent=true&limit=80"             -o /tmp/vn-proxies.json
          echo "Fresh VN HTTP proxies: $(python3 -c 'import json; print(len(json.load(open("/tmp/vn-proxies.json"))))')"

          python3 - <<'PY' > /tmp/vn-proxy-list.txt
import json
for p in json.load(open("/tmp/vn-proxies.json")):
    if p.get("ip") and p.get("port"):
        print(f'{p["ip"]}:{p["port"]}')
PY

          rm -f /tmp/proxy-results.txt
          while read -r proxy; do
            timeout 12 curl -sS --http1.1 -x "http://$proxy"               -A "Mozilla/5.0 (Linux; Android 14)"               -H "Referer: https://fptplay.vn/"               -H "Origin: https://fptplay.vn"               -H "Accept: application/vnd.apple.mpegurl,application/x-mpegURL,*/*"               -o /tmp/proxy-body               -w "$proxy|%{http_code}|%{content_type}|%{size_download}\n"               "$EVENT07" 2>/dev/null >> /tmp/proxy-results.txt || true
          done < /tmp/vn-proxy-list.txt

          echo "Working proxy candidates:"
          while IFS='|' read -r proxy code type size; do
            if [ "$code" = "200" ] && grep -q "#EXTM3U" /tmp/proxy-body 2>/dev/null; then
              echo "$proxy|$code|$type|$size|VALID_HLS"
            elif [ "$code" != "000" ] && [ "$code" != "403" ]; then
              echo "$proxy|$code|$type|$size"
            fi
          done < /tmp/proxy-results.txt | head -50 || true

          echo "All non-403 responses:"
          grep -vE '\|403\||\|000\|' /tmp/proxy-results.txt | head -50 || true

          rm -f /tmp/vn-proxies.json /tmp/vn-proxy-list.txt /tmp/proxy-results.txt /tmp/proxy-body

      - name: Check Worker status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev/status" | jq .
