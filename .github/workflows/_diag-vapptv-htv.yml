name: DIAG vAppTV HTV The Thao

on:
  push:
    paths:
      - ".github/workflows/_diag-vapptv-htv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch app catalog and inspect HTV Thể Thao
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            -A "okhttp/4.12.0" \
            -H "Accept: application/json,text/plain,*/*" \
            "https://freem3u.xyz/api/channels/x_1.0.1/app.json" \
            -o app.json

          python3 - <<'PY'
          import json, urllib.parse, urllib.request, re

          data=json.load(open("app.json",encoding="utf-8"))
          hits=[]
          for c in data.get("channels",[]):
              title=str(c.get("title","")).strip().lower()
              if title=="htv thể thao" or "htv thể thao" in title:
                  hits.append(c)
          print("API index:", data.get("index"))
          print("HTV matches:", len(hits))
          for c in hits:
              print("\nCHANNEL")
              print(json.dumps(c, ensure_ascii=False, indent=2))
              for i,s in enumerate(c.get("urls") or [],1):
                  print(f"\nSOURCE {i}: {json.dumps(s, ensure_ascii=False)}")
                  u=s.get("url")
                  if not isinstance(u,str) or not u.startswith("http"):
                      continue
                  q=urllib.parse.parse_qs(urllib.parse.urlparse(u).query)
                  targets=[]
                  if "videoUrl" in q: targets.append(("videoUrl",q["videoUrl"][0]))
                  if "audioUrl" in q: targets.append(("audioUrl",q["audioUrl"][0]))
                  if not targets and re.search(r'\\.(m3u8|mpd)(\\?|$)', urllib.parse.urlparse(u).path, re.I):
                      targets=[("url",u)]
                  if not targets and "/api/live/play." in u:
                      targets=[("api",u)]
                  for kind,target in targets:
                      print("  TARGET",kind,target)
                      try:
                          req=urllib.request.Request(target,headers={
                              "User-Agent":"Mozilla/5.0 (Linux; Android 15; SM-S918B) AppleWebKit/537.36 Chrome/135 Safari/537.36 vAppTV/1.0.2",
                              "Accept":"*/*"})
                          with urllib.request.urlopen(req,timeout=20) as r:
                              body=r.read(4096)
                              print("  STATUS",r.status,"TYPE",r.headers.get("Content-Type"),"LEN",r.headers.get("Content-Length"),"FINAL",r.geturl())
                              print("  BODY",body[:1500].decode("utf-8","replace"))
                      except Exception as e:
                          print("  ERROR",type(e).__name__,str(e))
          PY
