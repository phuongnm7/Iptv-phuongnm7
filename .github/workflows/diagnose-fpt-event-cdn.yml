name: Diagnose NM7 FPT Event CDN

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-fpt-event-cdn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check representative FPT event endpoints
        shell: bash
        run: |
          set +e
          urls=(
            "https://vips-livecdn.fptplay.net/live/media/su-kien-01/hls_avc_v6/index.m3u8"
            "https://vips-livecdn.fptplay.net/live/media/su-kien-09/hls_avc_v6/index.m3u8"
            "https://vips-livecdn.fptplay.net/live/media/su-kien-10/hls_avc_v6/index.m3u8"
            "https://vips-livecdn.fptplay.net/live/media/event-02/hls_avc_v6/index.m3u8"
            "https://vips-livecdn.fptplay.net/live/media/event-07/hls_avc_v6/index.m3u8"
            "https://vips-livecdn.fptplay.net/live/media/su-kien-01-4k/dash_hvc/index.mpd"
            "https://vips-livecdn.fptplay.net/live/media/event-02-4k/dash_hvc/index.mpd"
            "https://live.fptplay53.net/live/media/su-kien-01/hls_avc_v6/index.m3u8"
            "https://live-a.fptplay53.net/live/media/su-kien-01/hls_avc_v6/index.m3u8"
          )

          for url in "${urls[@]}"; do
            echo "=== $url ==="
            tmp="$(mktemp)"
            status="$(curl -L -sS --max-time 20               -A "VThanhTivi"               -H "Referer: https://fptplay.vn/"               -H "Origin: https://fptplay.vn/"               -o "$tmp"               -w "%{http_code} %{content_type}"               "$url" 2>"$tmp.err")"
            rc=$?
            echo "curl_rc=$rc status=$status"
            echo "body_prefix:"
            head -c 240 "$tmp" | tr '\n' ' ' | sed 's/[[:cntrl:]]/ /g'
            echo
            if [ -s "$tmp.err" ]; then
              echo "curl_error:"
              cat "$tmp.err"
            fi
            rm -f "$tmp" "$tmp.err"
          done

      - name: Check Worker status without triggering a scan
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev/status" | jq .
