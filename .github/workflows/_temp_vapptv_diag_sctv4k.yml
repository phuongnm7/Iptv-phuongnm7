name: _TEMP_vAppTV_DIAG_SCTV4K

on:
  push:
    paths:
      - ".github/workflows/_temp_vapptv_diag_sctv4k.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Follow nested SCTV config
        run: |
          python3 - <<'PY'
          import json, urllib.request

          def get(url, headers=None):
              h={"User-Agent":"okhttp/4.12.0","Accept":"application/json,text/plain,*/*"}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.read().decode("utf-8","replace")

          for sid in ["sctv4k","vtv9"]:
              p="https://freem3u.xyz/api/live/play.json?sid="+sid
              print("\n===== PLAY",sid,"=====")
              t=get(p)
              print(t[:20000])
              try:
                  root=json.loads(t)
                  spec=(root.get("data") if isinstance(root,dict) else root)
                  if isinstance(spec,dict) and isinstance(spec.get("url"),str):
                      u=spec["url"]
                      cfg=spec.get("httpConfig") if isinstance(spec.get("httpConfig"),dict) else {}
                      hs=spec.get("headers") if isinstance(spec.get("headers"),dict) else {}
                      h=dict(hs)
                      ch=cfg.get("headers") if isinstance(cfg.get("headers"),dict) else {}
                      h.update(ch)
                      print("\n===== NESTED",sid,u,"=====")
                      t2=get(u,h)
                      print(t2[:30000])
              except Exception as e:
                  print("ERROR",repr(e))
          PY
