name: _TEMP_vAppTV_DIAG_PLAYJSON

on:
  push:
    paths:
      - ".github/workflows/_temp_vapptv_diag_playjson.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe special endpoints
        run: |
          set +e
          for u in             "https://freem3u.xyz/api/live/play.json?vid=151"             "https://freem3u.xyz/api/live/play.json?sid=sctv4k"             "https://freem3u.xyz/api/live/play.json?sid=vtv9"             "https://freem3u.xyz/api/live/play.json?sid=sctv15"
          do
            echo "===== $u ====="
            curl -L --max-time 15 -sS               -H "User-Agent: okhttp/4.12.0"               -H "Accept: application/json,text/plain,*/*"               "$u" | head -c 10000
            echo
          done
