name: Scan FPT Event Live From Vietnam

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nm7-fpt-event-source-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Scan exact source URLs
        shell: bash
        env:
          OUTPUT_M3U: generated/fpt-event-live.m3u
          OUTPUT_STATUS: generated/fpt-event-live.status.json
          MAX_PROXY_TRIES: "40"
          MAX_WORKERS: "4"
          PROBE_TIMEOUT: "12"
        run: |
          set -euo pipefail
          python3 cloudflare/fpt-event-worker/tools/source-live-scanner.py

      - name: Validate source-only output
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://raw.githubusercontent.com/phuongnm7/Iptv-phuongnm7/main/sources/fpt-events-source.m3u"
          test -f generated/fpt-event-live.m3u
          SOURCE_TEXT="$(curl -fsSL --retry 3 --max-time 30 "$SOURCE")"
          OUTPUT_TEXT="$(cat generated/fpt-event-live.m3u)"

          printf '%s
' "$OUTPUT_TEXT" | awk '/^https?:\/\//{print}' | while read -r url; do
            grep -Fqx "$url" <<< "$SOURCE_TEXT" || {
              echo "ERROR: output URL is not an exact member of source: $url"
              exit 1
            }
          done

          ! grep -qE 'vhd0/Stuff|vuminhthanh12|metadata-assisted|event-a\.fptplay53|livecdn\.fptplay\.net/schedule' generated/fpt-event-live.m3u

          echo "Live output:"
          cat generated/fpt-event-live.m3u
          echo "Status:"
          cat generated/fpt-event-live.status.json

      - name: Commit only when live set changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/fpt-event-live.m3u
          if git diff --cached --quiet; then
            echo "Live set unchanged; no commit needed."
            exit 0
          fi
          git commit -m "data(fpt): update current live event set"
          git push origin HEAD:main
