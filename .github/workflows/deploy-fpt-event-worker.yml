name: Deploy NM7 FPT Event Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/fpt-event-worker/**"
      - "sources/fpt-events-source.m3u"
      - ".github/workflows/deploy-fpt-event-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nm7-fpt-event-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fpt-event-worker
          wranglerVersion: "4"
          command: deploy src/index.js --config wrangler.jsonc

      - name: Verify deployed Worker and source scan
        shell: bash
        run: |
          set -euo pipefail
          URL="https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev/scan"
          BODY="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 90 "$URL")"
          echo "$BODY"
          echo "$BODY" | jq -e '.ok == true and .candidates == 37 and .probeErrors == 0 and .inactiveEntries == (.candidates - .liveEntries) and .workerVersion == "fpt-event-404-inactive-v2"' >/dev/null
          echo "Verified: 37 exact FPT sources scanned; 404 inactive slots are not counted as probe errors; deployed version marker is correct."
