name: Update FPT Event Live Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: fpt-event-live
  cancel-in-progress: false

jobs:
  scan:
    name: Scan FPT batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4]

    steps:
      - name: Scan Worker batch
        env:
          WORKER_URL: https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev
        run: |
          set -e
          curl --fail --show-error --silent --retry 3 --retry-delay 2 \
            "${WORKER_URL}/scan?batch=${{ matrix.batch }}"
