          def norm(s):
              s=unicodedata.normalize('NFKD',s); s=''.join(c for c in s if not unicodedata.combining(c)); s=s.lower(); s=re.sub(r'\[hls\]|\b18\+\b',' ',s,flags=re.I); s=re.sub(r'\s*\([^)]*\)\s*$',' ',s); s=re.sub(r'[^a-z0-9]+',' ',s); return re.sub(r'\s+',' ',s).strip()
          def match_key(name):
              s=re.sub(r'^\s*[🟢🟡🔴⚽🏐🏀🎾]+\s*','',name); s=re.sub(r'^\s*\d{1,2}:\d{2}\s+\d{1,2}/\d{1,2}\s*','',s); s=re.sub(r'^\s*\d{1,2}:\d{2}\s*','',s); s=re.sub(r'\s*\([^)]*\)\s*$','',s); s=re.sub(r'\s*\[[^]]+\]\s*$','',s); s=re.sub(r'\b18\+\b','',s,flags=re.I); m=re.split(r'\s+v(?:s)?\s+',s,maxsplit=1,flags=re.I); return (norm(m[0])+' vs '+norm(m[1])) if len(m)==2 else norm(s)
