          seen=set()

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read().decode('utf-8','ignore')

          for base in sources:
              try:
                  home=get(base)
              except Exception as e:
                  print('Fallback source failed:',base,type(e).__name__)
                  continue
              hrefs=re.findall(r'href=[\\\"\\\']([^\\\"\\\']+)[\\\"\\\']',home,re.I)
              match_pages=[]
              for href in hrefs:
                  u=urljoin(base,html.unescape(href))
                  if '/truc-tiep/' in u and u not in match_pages:
                      match_pages.append(u)
              print('Fallback match pages discovered:',len(match_pages))
              for page in match_pages[:80]:
                  try:
                      body=get(page)
                  except Exception:
                      continue
                  title=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
                  name=re.sub(r'\\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',title.group(1) if title else page))).strip()
                  name=re.sub(r'\\s*[-|].*        env:
          TZ: Asia/Ho_Chi_Minh
        run: |
          python3 - <<'PY'
