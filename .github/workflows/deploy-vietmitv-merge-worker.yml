name: Deploy NM7 VietMiTV Merge Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/vietmitv-merge/**"
      - ".github/workflows/deploy-vietmitv-merge-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nm7-vietmitv-merge-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate Worker JavaScript
        shell: bash
        working-directory: cloudflare/vietmitv-merge
        run: |
          set -euo pipefail
          node --check src/index.js
          test -s wrangler.jsonc

      - name: Deploy dedicated Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/vietmitv-merge
          wranglerVersion: "4"
          command: deploy src/index.js --config wrangler.jsonc

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-vietmitv-merge.phuongnm7-iptv.workers.dev"
          BODY="$(curl -fsSL --retry 5 --retry-delay 3 --max-time 30 "$BASE/")"
          echo "$BODY"
          echo "$BODY" | jq -e '
            .service == "NM7 VietMiTV merged playlist"
            and .workerVersion == "nm7-vietmitv-merge-v1"
            and .generator == "GitHub Actions"
          ' >/dev/null
          echo "Worker health check passed."
