name: Deploy NM7 FPT Event Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/fpt-event-worker/**"
      - "sources/fpt-events-source.m3u"
      - ".github/workflows/deploy-fpt-event-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nm7-fpt-event-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Worker JavaScript
        shell: bash
        working-directory: cloudflare/fpt-event-worker
        run: |
          set -euo pipefail
          node --check src/index.js

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fpt-event-worker
          wranglerVersion: "4"
          command: deploy src/index.js --config wrangler.jsonc

      - name: Verify playlist without probing FPT origin
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev"
          STATUS="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$BASE/status")"
          echo "$STATUS"
          echo "$STATUS" | jq -e '
            .ok == true
            and .workerVersion == "fpt-event-strict-live-v10"
          ' >/dev/null

          PLAYLIST="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$BASE/fpt-event-live.m3u")"
          ENTRY_COUNT="$(printf '%s\n' "$PLAYLIST" | grep -c '^#EXTINF:' || true)"
          echo "Public strict playlist entry count: $ENTRY_COUNT"
          HEADERS="$(curl -fsS -D - -o /dev/null --retry 3 --retry-delay 2 --max-time 30 "$BASE/fpt-event-live.m3u")"
          echo "$HEADERS"
          echo "$HEADERS" | grep -qi '^x-nm7-fpt-verified: '
          echo "Verified: deployment did not force a new FPT source scan; strict live filtering uses clean verification when available and metadata-assisted current-event tracking during upstream 403."

          FALLBACK_HEADERS="$(curl -fsS -D - -o /dev/null --retry 3 --retry-delay 2 --max-time 30 "$BASE/fpt-event-fallback.m3u")"
          echo "$FALLBACK_HEADERS"
          echo "$FALLBACK_HEADERS" | grep -qi '^content-type: application/x-mpegURL'

      - name: Verify deployed Worker state (no forced source scan)
        shell: bash
        run: |
          set -euo pipefail
          STATUS_URL="https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev/status"
          STATUS="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$STATUS_URL")"
          echo "$STATUS"
          echo "$STATUS" | jq -e '
            .ok == true
            and .workerVersion == "fpt-event-strict-live-v10"
            and .scheduler.cron == "*/5 * * * *"
            and ((.scheduler.strategy // "") | contains("every 5 minutes"))
          ' >/dev/null

          HEADERS="$(curl -fsS -D - -o /dev/null --retry 3 --retry-delay 2 --max-time 30 "https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev/fpt-event-live.m3u")"
          echo "$HEADERS"
          echo "$HEADERS" | grep -qi '^content-type: application/x-mpegURL'
          echo "$HEADERS" | grep -qi '^x-nm7-fpt-version: fpt-event-strict-live-v10'
          echo "Verified: v10 is deployed, Cron is configured for every 5 minutes, and the strict live endpoint is exposing the expected version. No forced full scan is executed during CI deploy."
