name: Deploy NM7 FPT Event Watchdog

on:
  push:
    branches: [main]
    paths:
      - "tools/cloudflare-fpt-watchdog/**"
      - ".github/workflows/deploy-fpt-event-watchdog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nm7-fpt-event-watchdog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Validate Worker JavaScript
        working-directory: tools/cloudflare-fpt-watchdog
        run: node --check src/index.js
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/cloudflare-fpt-watchdog
          wranglerVersion: "4"
          secrets: |
            GITHUB_TOKEN
          command: deploy --config wrangler.toml
        env:
          GITHUB_TOKEN: ${{ secrets.FPT_WATCHDOG_GITHUB_TOKEN }}
      - name: Verify watchdog health
        run: |
          set -euo pipefail
          BASE="https://nm7-fpt-event-watchdog.phuongnm7-iptv.workers.dev"
          BODY="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$BASE/health")"
          echo "$BODY"
          echo "$BODY" | jq -e '.ok == true and .service == "nm7-fpt-event-watchdog" and .schedule == "*/5 * * * *" and .targetWorkflow == "fpt-event-scan.yml" and .tokenConfigured == true' >/dev/null

      - name: Verify GitHub dispatch path
        run: |
          set -euo pipefail
          BASE="https://nm7-fpt-event-watchdog.phuongnm7-iptv.workers.dev"
          BODY="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 -X POST "$BASE/run")"
          echo "$BODY"
          echo "$BODY" | jq -e '.ok == true and (.action == "noop" or .action == "dispatch") and .service == "nm7-fpt-event-watchdog" and .candidates == 46 and .source_only == true' >/dev/null
