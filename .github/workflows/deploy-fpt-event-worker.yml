name: Deploy NM7 FPT Event Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/fpt-event-worker/**"
      - ".github/workflows/deploy-fpt-event-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nm7-fpt-event-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate Worker JavaScript
        shell: bash
        working-directory: cloudflare/fpt-event-worker
        run: |
          set -euo pipefail
          node --check src/index.js

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fpt-event-worker
          wranglerVersion: "4"
          command: deploy src/index.js --config wrangler.jsonc

      - name: Verify delivery Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev"
          BODY="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$BASE/scan")"
          echo "$BODY"
          echo "$BODY" | jq -e '
            .workerVersion == "fpt-event-delivery-v15"
            and .scannerOwner == "GitHub Actions"
            and .deliveryOwner == "Cloudflare Worker"
            and .schedule == "*/5 * * * *"
          ' >/dev/null

          PLAYLIST_HEADERS="$(curl -fsS -D - -o /dev/null --retry 3 --retry-delay 2 --max-time 30 "$BASE/fpt-event-live.m3u")"
          echo "$PLAYLIST_HEADERS"
          echo "$PLAYLIST_HEADERS" | grep -qi '^content-type: application/x-mpegURL'
          echo "$PLAYLIST_HEADERS" | grep -qi '^x-nm7-fpt-version: fpt-event-delivery-v15'
          echo "Verified: Worker is delivery-only; GitHub Actions owns the 5-minute FPT scan."
