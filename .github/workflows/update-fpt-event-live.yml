name: Update FPT Event Live Playlist

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/filter_fpt_events.py"
      - ".github/workflows/update-fpt-event-live.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: fpt-event-live
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync with latest main before scan
        run: git pull --rebase origin main

      - name: Scan FPT public HLS event endpoints
        run: python3 tools/filter_fpt_events.py

      - name: Commit changed playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fpt-event-live.m3u
          if git diff --cached --quiet; then
            echo "No playlist change"
          else
            git commit -m "auto: update live FPT event playlist"
            git pull --rebase origin main
            git push
          fi
