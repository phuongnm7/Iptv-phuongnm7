name: Deploy NM7 FPT Event Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/fpt-event-worker/**"
      - "sources/fpt-events-source.m3u"
      - ".github/workflows/deploy-fpt-event-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nm7-fpt-event-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/fpt-event-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fpt-event-worker
          command: deploy
