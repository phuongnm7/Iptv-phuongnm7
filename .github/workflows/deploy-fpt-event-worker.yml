name: Deploy NM7 FPT Event Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/fpt-event-worker/**"
      - "sources/fpt-events-source.m3u"
      - ".github/workflows/deploy-fpt-event-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nm7-fpt-event-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose FPT CDN egress
        shell: bash
        run: |
          set +e
          urls=(
            "https://vips-livecdn.fptplay.net/live/media/su-kien-01/hls_avc_v6/index.m3u8"
            "https://vips-livecdn.fptplay.net/live/media/su-kien-02/hls_avc_v6/index.m3u8"
            "https://vips-livecdn.fptplay.net/live/media/su-kien-02-4k/dash_hvc/index.mpd"
            "https://livecdn.fptplay.net/schedule/sukien01_vhls.smil/playlist.m3u8"
            "https://livecdn.fptplay.net/schedule/sukien02_vhls.smil/playlist.m3u8"
            "https://live.fptplay53.net/live/media/su-kien-01/hls_avc_v6/index.m3u8"
            "https://live.fptplay53.net/live/media/su-kien-02/hls_avc_v6/index.m3u8"
            "https://live-a.fptplay53.net/live/media/su-kien-01/hls_avc_v6/index.m3u8"
            "https://live-a.fptplay53.net/live/media/su-kien-02/hls_avc_v6/index.m3u8"
          )
          for url in "${urls[@]}"; do
            echo "=== $url ==="
            tmp="$(mktemp)"
            status="$(curl -L -sS --max-time 20 -A "VThanhTivi" -H "Referer: https://fptplay.vn/" -H "Origin: https://fptplay.vn/" -o "$tmp" -w "%{http_code} %{content_type}" "$url" 2>"$tmp.err")"
            rc=$?
            echo "curl_rc=$rc status=$status"
            echo "body_prefix:"
            head -c 180 "$tmp" | tr '\n' ' ' | sed 's/[[:cntrl:]]/ /g'
            echo
            if [ -s "$tmp.err" ]; then echo "curl_error:"; cat "$tmp.err"; fi
            rm -f "$tmp" "$tmp.err"
          done
          echo "FPT CDN egress diagnostics complete; non-200 responses do not fail deployment."

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fpt-event-worker
          wranglerVersion: "4"
          command: deploy src/index.js --config wrangler.jsonc

      - name: Verify deployed Worker and source scan
        shell: bash
        run: |
          set -euo pipefail
          URL="https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev/scan"
          BODY="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 120 "$URL")"
          echo "$BODY"
          echo "$BODY" | jq -e '
            .ok == true
            and .candidates > 0
            and (.liveEntries + .inactiveEntries + .probeErrors == .candidates)
            and .workerVersion == "fpt-event-resilient-v7-subrequest-safe"
            and .subrequestBudget.used <= .subrequestBudget.maxExternalSubrequests
          ' >/dev/null
          echo "Verified: v7 quota-safe scan completed without exceeding its external subrequest safety budget."
